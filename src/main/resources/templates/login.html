<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Đăng nhập - JWT Nimbus</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css"
	rel="stylesheet">
</head>
<body class="bg-light">

	<div class="container d-flex justify-content-center align-items-center"
		style="min-height: 100vh;">
		<div class="card shadow p-4"
			style="max-width: 420px; width: 100%; border-radius: 12px;">
			<div class="text-center mb-4">
				<h3 class="text-primary font-weight-bold">ĐĂNG NHẬP</h3>
				<span class="badge bg-success">JWT Nimbus JOSE</span>
			</div>

			<form id="loginForm">
				<div class="mb-3">
					<label class="form-label font-weight-bold text-secondary">Địa
						chỉ Email</label> <input type="email" class="form-control" id="email"
						placeholder="name@example.com" required autofocus>
				</div>
				<div class="mb-3">
					<label class="form-label font-weight-bold text-secondary">Mật
						khẩu</label> <input type="password" class="form-control" id="password"
						placeholder="Nhập mật khẩu..." required>
				</div>
				<button type="button" id="loginBtn"
					class="btn btn-primary w-100 font-weight-bold py-2">Đăng
					Nhập</button>
			</form>
		</div>
	</div>

	<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
	<script th:src="@{/js/mainjs.js}"></script>
</body>
</html>
