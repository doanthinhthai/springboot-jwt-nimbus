<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Hồ Sơ Người Dùng - Spring Boot REST API</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light py-5">

    <div class="container">
        <div class="card shadow mx-auto" style="max-width: 550px; border-radius: 12px;">
            <div class="card-header bg-primary text-white text-center py-3">
                <h5 class="m-0 font-weight-bold">Spring Boot REST API with AJAX Example</h5>
            </div>
            <div class="card-body text-center p-4">
                <img id="images" src="https://startbootstrap.github.io/startbootstrap-sb-admin-2/img/undraw_profile.svg" 
                     class="rounded-circle border mb-3" width="110" height="110" alt="Avatar">
                
                <h3 id="profile" class="text-dark font-weight-bold mb-1">Đang tải thông tin...</h3>
                <p id="emailDisplay" class="text-muted mb-4"></p>

                <div class="alert alert-success small text-start">
                    <div>✅ <strong>Trạng thái:</strong> Xác thực thành công!</div>
                    <div>🔐 <strong>Thư viện xử lý:</strong> Nimbus JOSE + JWT (RFC 7519)</div>
                </div>

                <button id="logout" class="btn btn-danger font-weight-bold px-4">
                    Đăng Xuất
                </button>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script th:src="@{/js/mainjs.js}"></script>
</body>
</html>
